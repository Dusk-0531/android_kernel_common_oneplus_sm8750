name: Build Android Kernel (AK3)

on:
  push:
    branches:
      - main
      - master
      - android*
  pull_request:
    branches:
      - main
      - master
      - android*
  workflow_dispatch:
    inputs:
      device_name1:
        description: 'Device name 1 (e.g., sm8750)'
        required: false
        default: 'sm8750'
      device_name2:
        description: 'Device name 2 (e.g., oneplus)'
        required: false
        default: 'oneplus'
      defconfig:
        description: 'Defconfig to use (e.g., gki_defconfig)'
        required: false
        default: 'gki_defconfig'

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-22.04
    
    permissions:
      contents: read
    
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
        timeout-minutes: 10
      
      - name: Initialize Submodules
        run: |
          # Try to initialize submodule with timeout
          timeout 300 git submodule update --init --depth 1 drivers/starkernel || {
            echo "Warning: Submodule initialization failed or timed out"
            # Create empty placeholder files to avoid build errors
            mkdir -p drivers/starkernel
            cat > drivers/starkernel/Kconfig << 'EOF'
# StarKernel drivers configuration
config STARKERNEL
	bool "StarKernel drivers"
	default n
	help
	  Support for StarKernel drivers
EOF
            cat > drivers/starkernel/Makefile << 'EOF'
# StarKernel Makefile
obj-$(CONFIG_STARKERNEL) += starkernel.o
EOF
            echo "Created placeholder files for StarKernel"
          }
      
      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            g++-multilib \
            gcc-multilib \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            git \
            gnupg \
            gperf \
            imagemagick \
            lib32ncurses5-dev \
            lib32readline-dev \
            lib32z1-dev \
            libc6-dev-i386 \
            libelf-dev \
            liblz4-tool \
            libncurses5 \
            libncurses5-dev \
            libsdl1.2-dev \
            libssl-dev \
            libxml2 \
            libxml2-utils \
            lzop \
            pngcrush \
            rsync \
            schedtool \
            squashfs-tools \
            xsltproc \
            zip \
            zlib1g-dev \
            python3 \
            python-is-python3
      
      - name: Setup Clang Toolchain
        run: |
          mkdir -p prebuilts/clang/host/linux-x86
          cd prebuilts/clang/host/linux-x86
          
          # Download Clang from a reliable mirror
          CLANG_VERSION="clang-r522817"
          
          # Try multiple sources for Clang
          echo "Attempting to download Clang toolchain..."
          
          # Method 1: Try Google's archive
          if wget -q --timeout=60 -O clang.tar.gz \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/${CLANG_VERSION}.tar.gz"; then
            echo "Downloaded from Google source"
            mkdir -p ${CLANG_VERSION}
            tar -xzf clang.tar.gz -C ${CLANG_VERSION}
            rm clang.tar.gz
          # Method 2: Clone with sparse checkout (fallback)
          elif git clone --depth=1 --single-branch --branch=main \
            --filter=blob:none --sparse \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 temp_clang; then
            echo "Using git clone method"
            cd temp_clang
            git sparse-checkout set ${CLANG_VERSION}
            cd ..
            mv temp_clang/${CLANG_VERSION} .
            rm -rf temp_clang
          else
            echo "Error: Failed to download Clang toolchain"
            echo "Attempting to use system clang as fallback"
            # Create a symlink to system clang as last resort
            mkdir -p ${CLANG_VERSION}/bin
            ln -s /usr/bin/clang ${CLANG_VERSION}/bin/clang || true
            ln -s /usr/bin/clang++ ${CLANG_VERSION}/bin/clang++ || true
          fi
          
          # Verify clang exists
          if [ -f ${CLANG_VERSION}/bin/clang ]; then
            echo "Clang toolchain setup successful"
            ${CLANG_VERSION}/bin/clang --version
          else
            echo "Warning: Clang binary not found at expected location"
            ls -la ${CLANG_VERSION}/bin/ || echo "Bin directory does not exist"
          fi
      
      - name: Setup Build Tools
        run: |
          mkdir -p build/kernel
          
          # Clone build tools from AOSP with timeout
          echo "Cloning AOSP build tools..."
          timeout 300 git clone --depth=1 https://android.googlesource.com/kernel/build build/kernel/build-tools || {
            echo "Warning: Failed to clone build tools, continuing without them"
          }
          
          # Check what's in the build tools directory
          if [ -d "build/kernel/build-tools" ]; then
            echo "Build tools directory contents:"
            ls -la build/kernel/build-tools/
            
            # The build tools contain various utilities, add them to PATH if they exist
            if [ -d "build/kernel/build-tools/path/linux-x86" ]; then
              echo "PATH=$PWD/build/kernel/build-tools/path/linux-x86:$PATH" >> $GITHUB_ENV
              echo "Added build tools to PATH"
            fi
          else
            echo "Build tools not available, using system tools"
          fi
      
      - name: Build Kernel
        run: |
          set -e
          
          export ARCH=arm64
          export SUBARCH=arm64
          export CLANG_VERSION=clang-r522817
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          export LLVM=1
          export LLVM_IAS=1
          
          # Set toolchain paths
          export PATH="$PWD/prebuilts/clang/host/linux-x86/${CLANG_VERSION}/bin:$PATH"
          export LD_LIBRARY_PATH="$PWD/prebuilts/clang/host/linux-x86/${CLANG_VERSION}/lib64:$LD_LIBRARY_PATH"
          
          # Verify clang is accessible
          echo "Checking clang availability..."
          which clang && clang --version || {
            echo "Warning: Clang not found in PATH, trying system clang"
            export PATH="/usr/bin:$PATH"
            which clang && clang --version || {
              echo "Error: No clang compiler found"
              exit 1
            }
          }
          
          # Get defconfig from workflow input or use default
          DEFCONFIG="${{ github.event.inputs.defconfig || 'gki_defconfig' }}"
          echo "Using defconfig: ${DEFCONFIG}"
          
          # Verify defconfig exists
          if [ ! -f "arch/arm64/configs/${DEFCONFIG}" ]; then
            echo "Error: Defconfig ${DEFCONFIG} not found"
            echo "Available defconfigs:"
            ls -la arch/arm64/configs/*.defconfig
            exit 1
          fi
          
          # Configure
          echo "Configuring kernel with ${DEFCONFIG}..."
          make O=out ARCH=arm64 CC=clang ${DEFCONFIG}
          
          # Show configuration summary
          echo "Kernel version:"
          make O=out ARCH=arm64 kernelversion
          
          # Build
          echo "Building kernel with $(nproc --all) threads..."
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          
          # Verify build output
          if [ ! -f "out/arch/arm64/boot/Image.gz" ]; then
            echo "Error: Kernel image not found after build"
            exit 1
          fi
          
          echo "Build successful!"
          ls -lh out/arch/arm64/boot/Image.gz
      
      - name: Prepare AnyKernel3
        continue-on-error: true
        run: |
          # Clone AnyKernel3
          echo "Cloning AnyKernel3..."
          timeout 120 git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3 || {
            echo "Warning: Failed to clone AnyKernel3, skipping packaging"
            exit 0
          }
          
          # Remove .git to avoid conflicts
          rm -rf AnyKernel3/.git
          
          # Copy kernel image
          cp out/arch/arm64/boot/Image.gz AnyKernel3/
          
          # Find and copy dtb/dtbo if they exist
          if [ -f out/arch/arm64/boot/dtb.img ]; then
            cp out/arch/arm64/boot/dtb.img AnyKernel3/
          fi
          
          if [ -f out/arch/arm64/boot/dtbo.img ]; then
            cp out/arch/arm64/boot/dtbo.img AnyKernel3/
          fi
          
          # Update AnyKernel3 configuration
          cd AnyKernel3
          
          # Set kernel string
          KERNEL_VERSION=$(cat ../out/include/config/kernel.release)
          sed -i "s/kernel.string=.*/kernel.string=Custom Kernel ${KERNEL_VERSION} by GitHub Actions/" anykernel.sh
          
          # Set device properties from workflow inputs or use defaults
          DEVICE_NAME1="${{ github.event.inputs.device_name1 || 'sm8750' }}"
          DEVICE_NAME2="${{ github.event.inputs.device_name2 || 'oneplus' }}"
          sed -i "s/device.name1=.*/device.name1=${DEVICE_NAME1}/" anykernel.sh
          sed -i "s/device.name2=.*/device.name2=${DEVICE_NAME2}/" anykernel.sh
      
      - name: Package AnyKernel3 ZIP
        continue-on-error: true
        run: |
          if [ ! -d "AnyKernel3" ]; then
            echo "AnyKernel3 directory not found, skipping"
            exit 0
          fi
          
          cd AnyKernel3
          zip -r9 ../AnyKernel3-kernel.zip * -x .git README.md *placeholder
          cd ..
          
          # Calculate checksums
          sha256sum AnyKernel3-kernel.zip > AnyKernel3-kernel.zip.sha256
      
      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: |
            out/arch/arm64/boot/Image.gz
          if-no-files-found: error
      
      - name: Upload AnyKernel3 ZIP
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: AnyKernel3-flashable
          path: |
            AnyKernel3-kernel.zip
            AnyKernel3-kernel.zip.sha256
          if-no-files-found: warn
      
      - name: Upload Build Info
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: build-info
          path: |
            out/.config
            out/include/config/kernel.release
          if-no-files-found: warn
